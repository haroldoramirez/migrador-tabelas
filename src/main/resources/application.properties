spring.application.name=migrador-tabelas
server.port=8080
spring.thymeleaf.cache=false

# Configuração do Banco de Origem (H2 em memória)
spring.datasource.url=jdbc:h2:mem:banco_origem;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

